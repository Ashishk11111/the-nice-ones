name: fetch-jobs
on:
  schedule: [{cron: "0 * * * *"}]
  workflow_dispatch:
concurrency:
  group: fetch-jobs
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python fetch_jobs.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add -A; git diff --cached --quiet || (git commit -m "update jobs" && git pull --rebase -X theirs origin main && git push)
